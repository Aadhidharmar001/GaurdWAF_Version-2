[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardwaf"
version = "1.0.0"
description = "Agent Action Authorization & Runtime Governance Platform"

readme = "README.md"
authors = [
    { name = "GuardWAF Security Team", email = "security@guardwaf.io" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "pyjwt>=2.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sqlalchemy>=2.0.0"
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
langgraph = ["langgraph>=0.0.1"]
crewai = ["crewai>=0.1.0"]
mcp = ["mcp>=0.1.0"]
redis = ["redis>=4.5.0"]
observability = ["prometheus-client>=0.17.0", "opentelemetry-api>=1.20.0"]
all = [
    "guardwaf[langchain,langgraph,crewai,mcp,redis,observability]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["guardwaf*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "F401",
    "F841",
    "E402",
    "W291",
    "E741",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
